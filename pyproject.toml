[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llc-dynamics"
version = "0.0.0"
description = "Minimal LLC Neural ODE project skeleton"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.15,<2",
    "torch==2.14.1+cu130",
]

[tool.setuptools.packages.find]
where = ["src"]
