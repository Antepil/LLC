# LLC Neural ODE 基础配置。
# 网络、归一化、窗口、求解器、损失及训练契约。

data:
  # 状态、门极和 Vin 的顺序同时定义网络九维输入的拼接顺序。
  state_variables: [i_Lr, v_Cr, i_Lm, v_o]
  state_units: [A, V, A, V]
  binary_input_variables: [Q1_A_high, Q2_A_low, Q3_B_high, Q4_B_low]
  binary_input_allowed_values: [0, 1]
  continuous_input_variables: [Vin]
  input_variables:
    [i_Lr, v_Cr, i_Lm, v_o, Q1_A_high, Q2_A_low, Q3_B_high, Q4_B_low, Vin]

condition:
  # 首版模型仅用于这一固定负载；负载不是网络输入。
  load_resistance_ohm: 2.304

model:
  # f_theta([z, gates, Vin / V_ref]) -> dz/dtau
  input_dim: 9
  output_dim: 4
  hidden_dims: [128, 128]
  activation: SiLU
  dtype: float64
  device: cuda:0
  initialization:
    weights: xavier_uniform
    gain: 1.0
    bias: zeros

normalization:
  # 仅用训练集计算四个状态的 RMS；不减均值，保留物理零点。
  network_input: [z_i_Lr, z_v_Cr, z_i_Lm, z_v_o,
                  Q1_A_high, Q2_A_low, Q3_B_high, Q4_B_low, Vin_over_V_ref]
  network_output: [dz_i_Lr_dtau, dz_v_Cr_dtau, dz_i_Lm_dtau, dz_v_o_dtau]
  state_scale_rule: train_rms_scale_only
  state_scale_epsilon: 1.0e-12
  # 基础配置尚未拟合；训练集装载后必须写入四个正数，并保存到运行配置/检查点。
  state_scales: null
  vin_reference_v: 400.0
  # 以 110 kHz 参考周期归一化时间，固定网格步长对应 delta_tau = 0.01。
  time_reference_s: 9.090909090909091e-6

window:
  # 窗口含 100 个积分区间和 101 个状态节点；尾部不足一个完整窗口时不补齐。
  length_intervals: 100
  # 首版使用无重叠窗口；可在后续实验配置中减小步幅以增加重叠。
  stride_intervals: 100

solver:
  # 在准确门极事件处分段，每个门极不变的分段使用固定最大步长 RK4。
  method: rk4
  max_step_tau: 0.01

loss:
  # 对数值积分器生成的归一化状态序列计算 MSE，不监督直接导数。
  type: normalized_rollout_mse
  state_dim: 4
  exclude_initial_state: true
  reduction: mean

training:
  # 正式数据由 MATLAB 生成器按 train/validation/test 子目录保存。
  data_directory: data/raw/llc_sinusoidal_excitation/continuous_random
  dataset_manifest: configs/matlab/sinusoidal_excitation/continuous_random_data_generation.json
  dataset_policy: formal_complete
  evaluate_test: true
  file_pattern: '*.mat'
  split_directories:
    train: train
    validation: validation
    test: test
  epochs: 100
  batch_size: 16
  num_workers: 0
  pin_memory: true
  seed: 20261025
  optimizer:
    type: AdamW
    learning_rate: 1.0e-3
    weight_decay: 1.0e-4
  gradient_clip_norm: 1.0
  resume_last: true

# ==================== 检查点保存 ====================
checkpoint:
  # 相对路径统一以项目根目录解析，不依赖命令执行目录。
  directory: artifacts/checkpoints
  topk:
    # 用于筛选最佳检查点的指标名称，须与训练记录的指标一致。
    monitor_key: val_rollout_mse
    # 验证集滚动 MSE 越小越好；测试集不参与模型选择。
    mode: min
    # 保留的最佳检查点数量。
    k: 5
    # 检查点文件名模板，所用字段须由保存逻辑提供。
    format_str: 'epoch={epoch:04d}-val_rollout_mse={val_rollout_mse:.6e}.ckpt'
  # 是否保存最新检查点。
  save_last_ckpt: true
  # 工作区快照尚未定义；启用时配置解析会显式报错。
  save_last_snapshot: false
